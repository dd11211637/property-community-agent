name: Repair CI quality gates

on:
  push:
    branches:
      - fix/ci-quality-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply code and contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/property_agent/agent/infrastructure/models.py",
              "    Boolean,\n    DateTime,",
              "    Boolean,\n    CheckConstraint,\n    DateTime,",
          )
          replace(
              "src/property_agent/agent/infrastructure/models.py",
              "    __table_args__ = (\n        Index(\"ix_agent_conversations_actor\", \"actor_id\"),",
              "    __table_args__ = (\n        CheckConstraint(\n            \"runtime_version = 'v2'\", name=\"ck_agent_conversations_runtime_v2_only\"\n        ),\n        Index(\"ix_agent_conversations_actor\", \"actor_id\"),",
          )
          replace(
              "frontend/src/ui/display.ts",
              "return Number.isNaN(date.getTime()) ? fallback : date.toLocaleString(\"zh-CN\");",
              "return Number.isNaN(date.getTime())\n    ? fallback\n    : date.toLocaleString(\"zh-CN\", { timeZone: \"Asia/Shanghai\" });",
          )
          replace(
              "frontend/src/ui/display.ts",
              "  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) throw new Error(\"请选择有效的日期和时间。\");\n  return date.toISOString();",
              "  const date = new Date(`${value}+08:00`);\n  if (Number.isNaN(date.getTime())) throw new Error(\"请选择有效的日期和时间。\");\n  return date.toISOString();",
          )
          replace(
              "frontend/tests/pages/AgentHome.test.tsx",
              "appointment_at: new Date(\"2026-08-31T21:25\").toISOString(),",
              "appointment_at: new Date(\"2026-08-31T21:25+08:00\").toISOString(),",
          )
          replace(
              "compose.yaml",
              "  ENV: demo",
              "  ENV: ${APP_ENV:-demo}",
          )
          PY

      - name: Refresh committed OpenAPI contract
        run: python scripts/export_openapi.py

      - name: Format and validate changed backend files
        run: |
          python -m ruff format src/property_agent/agent/infrastructure/models.py
          python -m ruff check src/property_agent/agent/infrastructure/models.py

      - name: Commit ordinary repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/property_agent/agent/infrastructure/models.py \
                  frontend/src/ui/display.ts \
                  frontend/tests/pages/AgentHome.test.tsx \
                  compose.yaml \
                  docs/api/openapi.json
          git commit -m "fix(ci): repair contracts runtime metadata and timezone"
          git push origin HEAD:fix/ci-quality-gates
