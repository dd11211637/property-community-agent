name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check src tests testing alembic scripts
      - run: python -m ruff format --check src tests testing alembic scripts
      - run: python scripts/check_code_structure.py
      - run: python -m compileall -q src
      - run: python -m pip check
      - name: Verify committed OpenAPI contract is current
        run: python scripts/export_openapi.py && git diff --exit-code -- docs/api/openapi.json
      - run: python -m pytest -rs
      - name: Self-contained local functional closure
        run: python -m testing.local_functional_closure --output local-functional-closure.json
      - name: Deterministic agent eval gate (P1)
        run: python -m pytest tests/agent/test_pr5_scenario_evaluation.py -q
      - name: Governed Memory paired value gate (PR6)
        run: python testing/memory_value_eval.py tests/agent/data/pr6_memory_value_cases.json
      - name: PR7-B evidence schema and bounded load harness smoke
        run: python -m pytest tests/testing/test_pr7b_gates.py tests/platform/test_pr7b_pool_observability.py -q
      - name: PR7-B safe chaos fault-injection smoke
        run: python -m testing.pr7b.chaos_gate --campaign safe --output pr7b-chaos-smoke.json
      - name: PR7-B deterministic adversarial release gate
        run: python -m testing.pr7b.adversarial_gate --output pr7b-adversarial.json
      - name: Upload PR7-B deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr7b-deterministic-${{ github.sha }}
          path: |
            pr7b-chaos-smoke.json
            pr7b-adversarial.json
            local-functional-closure.json
          retention-days: 30

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: property_agent_test
          POSTGRES_USER: property_agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U property_agent -d property_agent_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://property_agent:test-password@127.0.0.1:5432/property_agent_test
      DATABASE_URL: postgresql+psycopg://property_agent:test-password@127.0.0.1:5432/property_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - name: Install official LangGraph checkpoint schema
        run: python scripts/setup_langgraph_checkpointer.py
      - name: Run PostgreSQL concurrency suite (no skips allowed)
        run: python -m pytest -m postgres -v -rs --junitxml=pytest-postgres.xml
      - name: Enforce zero skips
        run: python scripts/check_postgres_no_skip.py pytest-postgres.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      DEMO_FAIL_MODEL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start real PostgreSQL application stack
        run: >-
          docker compose -f compose.yaml -f testing/compose.demo.yaml
          up -d --build --wait postgres backend frontend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      - name: Show service logs on failure
        if: failure()
        run: >-
          docker compose -f compose.yaml -f testing/compose.demo.yaml
          logs --no-color backend frontend postgres
      - if: always()
        run: >-
          docker compose -f compose.yaml -f testing/compose.demo.yaml
          down --volumes
