limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
# This edge guard mitigates bursts; durable account/IP throttling is enforced by
# the backend LoginGuard.  Keep enough headroom for role-switching E2E and support
# desks sharing one NAT address without weakening the application-level lockout.
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
