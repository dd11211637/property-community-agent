[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "property-community-agent"
version = "0.1.0"
description = "Property and residential community management agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "bcrypt>=4.0,<5",
    "cryptography>=42,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/property_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires TEST_POSTGRES_URL and a dedicated PostgreSQL test database",
    "performance: requires a running integrated API and explicit environment configuration",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["llm-as-judge"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017"]  # datetime.UTC not available in Python 3.10

[tool.coverage.run]
source = ["property_agent"]
branch = true
