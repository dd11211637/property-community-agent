<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物业社区管理AI智能体 · 费用查询与智能缴费</title>
<style>
  :root {
    --primary: #4F6EF7;
    --primary-light: #EEF1FE;
    --success: #22C55E;
    --success-light: #F0FDF4;
    --warning: #F59E0B;
    --warning-light: #FFFBEB;
    --danger: #EF4444;
    --danger-light: #FEF2F2;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #4F6EF7 0%, #7C5CFC 100%);
    color: #fff; padding: 24px 32px;
    box-shadow: 0 4px 20px rgba(79,110,247,.25);
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .header p { font-size: 13px; opacity: .85; margin-top: 4px; }

  /* Container */
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

  /* Role Tabs */
  .role-tabs {
    display: flex; gap: 8px; margin-bottom: 24px;
    background: var(--card); border-radius: var(--radius);
    padding: 6px; box-shadow: var(--shadow);
  }
  .role-tab {
    flex: 1; padding: 12px 16px; border: none; background: transparent;
    border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--text-secondary); transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .role-tab.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(79,110,247,.3); }
  .role-tab:hover:not(.active) { background: var(--primary-light); color: var(--primary); }
  .role-icon { font-size: 18px; }

  /* Summary Card */
  .summary-card {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 20px;
    display: flex; gap: 24px; align-items: center;
  }
  .summary-stat { flex: 1; text-align: center; }
  .summary-stat .value { font-size: 28px; font-weight: 800; color: var(--primary); }
  .summary-stat .value.danger { color: var(--danger); }
  .summary-stat .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .summary-divider { width: 1px; height: 48px; background: var(--border); }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
    flex-wrap: wrap;
  }
  .toolbar .btn { padding: 8px 16px; }

  /* Section Title */
  .section-title {
    font-size: 16px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

  /* Bill Cards */
  .bill-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .bill-card {
    background: var(--card); border-radius: var(--radius); padding: 20px 24px;
    box-shadow: var(--shadow); border-left: 4px solid var(--border);
    transition: all .2s;
    display: flex; align-items: center; gap: 20px;
  }
  .bill-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .bill-card.unpaid { border-left-color: var(--primary); }
  .bill-card.overdue { border-left-color: var(--danger); }
  .bill-card.paid { border-left-color: var(--success); opacity: .85; }
  .bill-card.cancelled { border-left-color: var(--text-secondary); opacity: .6; }
  .bill-card.selected { background: var(--primary-light); }

  .bill-period { min-width: 80px; }
  .bill-period .month { font-size: 20px; font-weight: 800; }
  .bill-period .year { font-size: 12px; color: var(--text-secondary); }

  .bill-info { flex: 1; }
  .bill-info .amount { font-size: 22px; font-weight: 800; }
  .bill-info .detail { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .bill-info .detail span { margin-right: 12px; }

  .bill-due { font-size: 12px; color: var(--text-secondary); min-width: 90px; text-align: right; }

  .bill-status {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    white-space: nowrap;
  }
  .bill-status.unpaid { background: var(--primary-light); color: var(--primary); }
  .bill-status.overdue { background: var(--danger-light); color: var(--danger); }
  .bill-status.paid { background: var(--success-light); color: var(--success); }
  .bill-status.cancelled { background: #F1F5F9; color: var(--text-secondary); }

  .bill-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bill-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }

  /* Buttons */
  .btn {
    padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all .2s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #3D5CE5; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #16A34A; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #DC2626; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { background: #D97706; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Pagination */
  .pagination {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    margin-top: 20px; padding: 12px 0;
  }
  .pagination .page-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); transition: all .2s;
  }
  .pagination .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .pagination .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pagination .page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pagination .page-info { font-size: 13px; color: var(--text-secondary); padding: 0 8px; }

  /* AI Panel */
  .ai-panel {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 20px;
    border: 1.5px solid var(--primary-light);
  }
  .ai-panel-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .ai-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4F6EF7, #7C5CFC);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; flex-shrink: 0;
  }
  .ai-panel-title { font-weight: 700; font-size: 15px; }
  .ai-panel-subtitle { font-size: 12px; color: var(--text-secondary); }

  .ai-bubble {
    background: var(--bg); border-radius: 12px; padding: 16px;
    font-size: 14px; line-height: 1.8; margin-bottom: 12px;
    white-space: pre-wrap;
  }
  .ai-loading { color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .ai-loading .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .reminder-box {
    border-radius: 10px; padding: 14px 16px; font-size: 13px;
    display: flex; align-items: flex-start; gap: 10px; margin-top: 12px;
  }
  .reminder-box.gentle { background: var(--primary-light); color: #3D5CE5; }
  .reminder-box.short { background: var(--warning-light); color: #B45309; }
  .reminder-box.long { background: var(--danger-light); color: #B91C1C; }
  .reminder-icon { font-size: 18px; flex-shrink: 0; }

  /* Admin Panel */
  .admin-panel {
    background: var(--card); border-radius: var(--radius); padding: 16px 20px;
    box-shadow: var(--shadow); margin-bottom: 16px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap;
  }
  .admin-panel .label { font-size: 12px; color: var(--text-secondary); margin-right: 4px; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 32px;
    width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
    animation: slideUp .3s; max-height: 80vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal h3 { font-size: 18px; margin-bottom: 16px; }
  .modal-close {
    float: right; border: none; background: none; cursor: pointer;
    font-size: 22px; color: var(--text-secondary); line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  /* Receipt */
  .receipt {
    border: 2px dashed var(--border); border-radius: 12px; padding: 24px;
    background: #FAFBFC;
  }
  .receipt-header { text-align: center; margin-bottom: 20px; }
  .receipt-header h2 { font-size: 18px; color: var(--primary); }
  .receipt-header .no { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .receipt-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .receipt-row.total { font-weight: 800; font-size: 16px; border-top: 2px solid var(--text); margin-top: 8px; padding-top: 10px; }
  .receipt-footer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 16px; }
  .receipt-stamp { text-align: right; margin-top: 12px; }
  .receipt-stamp span {
    display: inline-block; border: 3px solid var(--danger); border-radius: 50%;
    padding: 8px 12px; color: var(--danger); font-weight: 800; font-size: 14px;
    transform: rotate(-15deg); opacity: .8;
  }

  /* Payment History Table */
  .history-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .history-table th {
    background: var(--bg); padding: 10px 12px; text-align: left;
    font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border);
  }
  .history-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .history-table tr:hover { background: var(--primary-light); }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1E293B; color: #fff; padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600; z-index: 200;
    animation: toastIn .3s, toastOut .3s 2.7s;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

  .role-info {
    background: var(--card); border-radius: var(--radius); padding: 16px 20px;
    box-shadow: var(--shadow); margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .bill-card { flex-wrap: wrap; gap: 10px; }
    .bill-actions { width: 100%; justify-content: flex-end; }
    .summary-card { flex-direction: column; gap: 16px; }
    .summary-divider { width: 100%; height: 1px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🏘️ 物业社区管理 AI 智能体</h1>
  <p>费用查询与智能缴费 · 让社区生活更便捷</p>
</div>

<div class="container">
  <!-- Role Tabs -->
  <div class="role-tabs" id="roleTabs">
    <button class="role-tab active" data-role="owner" data-user="user_101">
      <span class="role-icon">👤</span> 业主用户
    </button>
    <button class="role-tab" data-role="staff" data-user="staff_201">
      <span class="role-icon">👷</span> 物业工作人员
    </button>
    <button class="role-tab" data-role="admin" data-user="admin_301">
      <span class="role-icon">👑</span> 社区管理员
    </button>
  </div>

  <!-- User Info -->
  <div class="role-info" id="roleInfo">
    <span style="font-size:24px;">👤</span>
    <div>
      <strong id="infoName">张三</strong>
      <span style="font-size:12px;color:var(--text-secondary);margin-left:8px;" id="infoRole">业主用户</span>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;" id="infoDetail">1号楼 201室</div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel" style="display:none;">
    <span class="label">⚙️ 管理操作</span>
    <button class="btn btn-warning btn-sm" onclick="generateBills()">📅 生成账单</button>
    <button class="btn btn-outline btn-sm" onclick="checkOverdue()">🔍 逾期检查</button>
    <button class="btn btn-danger btn-sm" onclick="refundBillById()">↩️ 退款</button>
  </div>

  <!-- Summary -->
  <div class="summary-card" id="summaryCard">
    <div class="summary-stat">
      <div class="value danger" id="totalUnpaid">¥0.00</div>
      <div class="label">欠费总额</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="value" id="unpaidCount">0</div>
      <div class="label">待缴费笔数</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="value" style="color:var(--success);" id="paidCount">0</div>
      <div class="label">已缴费笔数</div>
    </div>
  </div>

  <!-- AI Panel -->
  <div class="ai-panel" id="aiPanel" style="display:none;">
    <div class="ai-panel-header">
      <div class="ai-avatar">🤖</div>
      <div>
        <div class="ai-panel-title">AI 管家 · 小智</div>
        <div class="ai-panel-subtitle">正在为您解读账单...</div>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-left:auto;" onclick="closeAIPanel()">✕</button>
    </div>
    <div class="ai-bubble" id="aiContent">
      <div class="ai-loading"><span class="spinner"></span>小智正在分析您的账单...</div>
    </div>
    <div class="reminder-box" id="reminderBox" style="display:none;"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="section-title" style="margin-bottom:0;flex:1;"><span class="dot"></span> 账单列表</div>
    <button class="btn btn-outline btn-sm" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none;">☐ 全选</button>
    <button class="btn btn-primary btn-sm" id="batchPayBtn" onclick="batchPaySelected()" style="display:none;">💳 批量缴费</button>
    <button class="btn btn-outline btn-sm" id="exportBtn" onclick="exportBills()">📥 导出CSV</button>
    <button class="btn btn-outline btn-sm" id="historyBtn" onclick="openHistoryModal()">📋 支付记录</button>
  </div>

  <!-- Bill List -->
  <div class="bill-list" id="billList"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none;"></div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="payModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" onclick="closePayModal()">✕</button>
    <h3>💳 确认缴费</h3>
    <div id="payContent"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closePayModal()">取消</button>
      <button class="btn btn-success" style="flex:1;" id="confirmPayBtn" onclick="confirmPay()">
        确认支付
      </button>
    </div>
  </div>
</div>

<!-- Batch Pay Modal -->
<div class="modal-overlay" id="batchPayModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" onclick="closeBatchPayModal()">✕</button>
    <h3>💳 批量缴费确认</h3>
    <div id="batchPayContent"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeBatchPayModal()">取消</button>
      <button class="btn btn-success" style="flex:1;" id="confirmBatchPayBtn" onclick="confirmBatchPay()">
        确认批量支付
      </button>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal-overlay" id="receiptModal" style="display:none;">
  <div class="modal" style="max-width:420px;">
    <button class="modal-close" onclick="closeReceiptModal()">✕</button>
    <div class="receipt" id="receiptContent"></div>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal" style="display:none;">
  <div class="modal" style="max-width:640px;">
    <button class="modal-close" onclick="closeHistoryModal()">✕</button>
    <h3>📋 支付记录</h3>
    <div id="historyContent"></div>
  </div>
</div>

<!-- Refund Modal -->
<div class="modal-overlay" id="refundModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" onclick="closeRefundModal()">✕</button>
    <h3>↩️ 退款操作</h3>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px;font-weight:600;">账单ID</label>
      <input type="text" id="refundBillId" class="input-field" placeholder="输入账单ID，如 bill_202607_101" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-top:4px;font-size:14px;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px;font-weight:600;">退款原因</label>
      <input type="text" id="refundReason" class="input-field" value="管理员退款" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-top:4px;font-size:14px;">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeRefundModal()">取消</button>
      <button class="btn btn-danger" style="flex:1;" id="confirmRefundBtn" onclick="confirmRefund()">
        确认退款
      </button>
    </div>
  </div>
</div>

<script>
// ── State ──
const state = {
  currentRole: 'owner',
  currentUserId: 'user_101',
  bills: [],
  payingBillId: null,
  selectedBills: new Set(),
  currentPage: 1,
  pageSize: 20,
  totalPages: 1,
  totalCount: 0,
};

// ── API ──
const API = '';

async function fetchBills(page = 1) {
  const res = await fetch(`${API}/api/bills?user_id=${state.currentUserId}&role=${state.currentRole}&page=${page}&page_size=${state.pageSize}`);
  if (!res.ok) throw new Error('获取账单失败');
  return res.json();
}

async function fetchInterpret(billId) {
  const res = await fetch(`${API}/api/bills/interpret`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: billId, user_id: state.currentUserId }),
  });
  if (!res.ok) throw new Error('解读失败');
  return res.json();
}

async function payBill(billId) {
  const res = await fetch(`${API}/api/bills/pay`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: billId, user_id: state.currentUserId }),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '支付失败'); }
  return res.json();
}

async function payBillsBatch(billIds) {
  const res = await fetch(`${API}/api/bills/pay/batch`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_ids: billIds, user_id: state.currentUserId }),
  });
  if (!res.ok) throw new Error('批量支付失败');
  return res.json();
}

async function cancelBill(billId) {
  const res = await fetch(`${API}/api/bills/cancel`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: billId, reason: '管理员手动作废' }),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '取消失败'); }
  return res.json();
}

async function refundBill(billId, reason) {
  const res = await fetch(`${API}/api/bills/refund`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bill_id: billId, reason: reason }),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '退款失败'); }
  return res.json();
}

async function generateBillsApi(period = '') {
  const res = await fetch(`${API}/api/bills/generate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ period: period }),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '生成失败'); }
  return res.json();
}

async function checkOverdueApi() {

// ── Render ──
function renderBills(bills) {
  const list = document.getElementById('billList');
  const statusMap = { UNPAID: '未到期', OVERDUE: '已逾期', PAID: '已缴费', CANCELLED: '已作废' };
  const statusClass = { UNPAID: 'unpaid', OVERDUE: 'overdue', PAID: 'paid', CANCELLED: 'cancelled' };
  const isOwner = state.currentRole === 'owner';
  const isAdmin = state.currentRole === 'admin';

  // Show/hide batch controls
  const showBatch = isOwner || isAdmin;
  document.getElementById('selectAllBtn').style.display = showBatch ? 'inline-block' : 'none';
  document.getElementById('batchPayBtn').style.display = showBatch ? 'inline-block' : 'none';
  document.getElementById('adminPanel').style.display = isAdmin ? 'flex' : 'none';

  state.selectedBills.clear();

  list.innerHTML = bills.map(b => {
    const canPay = b.status === 'UNPAID' || b.status === 'OVERDUE';
    const isSelected = state.selectedBills.has(b.bill_id);
    const showCheckbox = showBatch && canPay;

    return `
    <div class="bill-card ${statusClass[b.status]} ${isSelected ? 'selected' : ''}" id="bill-${b.bill_id}">
      ${showCheckbox ? `<input type="checkbox" class="bill-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleBillSelect('${b.bill_id}', this.checked)" onclick="event.stopPropagation();">` : ''}
      <div class="bill-period">
        <div class="month">${b.period.split('-')[1]}月</div>
        <div class="year">${b.period.split('-')[0]}年</div>
      </div>
      <div class="bill-info">
        <div class="amount">¥${b.total_amount.toFixed(2)}</div>
        <div class="detail">
          <span>物业费 ¥${b.property_fee.toFixed(2)}</span>
          <span>公摊水电 ¥${b.utility_fee.toFixed(2)}</span>
          <span>车位费 ¥${b.parking_fee.toFixed(2)}</span>
          ${b.late_fee > 0 ? `<span style="color:var(--danger);">滞纳金 ¥${b.late_fee.toFixed(2)}</span>` : ''}
        </div>
        ${!isOwner ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${b.user_name} · ${b.building_name} ${b.room_number}</div>` : ''}
      </div>
      <div class="bill-due">
        ${b.status !== 'PAID' && b.status !== 'CANCELLED' ? `最迟缴费<br>${b.due_date}` : `缴费时间<br>${b.payment_time?.split(' ')[0] || ''}`}
      </div>
      <span class="bill-status ${statusClass[b.status]}">${statusMap[b.status]}</span>
      <div class="bill-actions">
        ${canPay ? `
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();interpretBill('${b.bill_id}')">🤖 AI解读</button>
          <button class="btn btn-success btn-sm" onclick="event.stopPropagation();openPayModal('${b.bill_id}')">💳 缴费</button>
        ` : b.status === 'PAID' ? `
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();viewReceipt('${b.receipt_no}')">📄 查看票据</button>
        ` : ''}
        ${isAdmin && canPay ? `
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();cancelBillById('${b.bill_id}')">✕ 作废</button>
        ` : ''}
        ${isAdmin && b.status === 'PAID' ? `
          <button class="btn btn-warning btn-sm" onclick="event.stopPropagation();refundSingleBill('${b.bill_id}')">↩️ 退款</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderPagination(data) {
  const pagination = document.getElementById('pagination');
  if (!data.total_pages || data.total_pages <= 1) {
    pagination.style.display = 'none';
    return;
  }
  pagination.style.display = 'flex';

  const page = data.page || 1;
  const totalPages = data.total_pages || 1;
  const total = data.total_count || 0;

  let html = '';
  html += `<button class="page-btn" onclick="goToPage(1)" ${page <= 1 ? 'disabled' : ''}>«</button>`;
  html += `<button class="page-btn" onclick="goToPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;

  const startPage = Math.max(1, page - 2);
  const endPage = Math.min(totalPages, page + 2);
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
  }

  html += `<button class="page-btn" onclick="goToPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>`;
  html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${page >= totalPages ? 'disabled' : ''}>»</button>`;
  html += `<span class="page-info">共 ${total} 条，${page}/${totalPages} 页</span>`;

  pagination.innerHTML = html;
}

async function loadBills(page = 1) {
  try {
    const data = await fetchBills(page);
    state.bills = data.bills;
    state.currentPage = data.page || page;
    state.totalPages = data.total_pages || 1;
    state.totalCount = data.total_count || data.bills.length;
    renderBills(data.bills);
    renderPagination(data);

    // Update summary
    document.getElementById('totalUnpaid').textContent = `¥${(data.total_unpaid || 0).toFixed(2)}`;
    document.getElementById('unpaidCount').textContent = data.unpaid_count || 0;
    document.getElementById('paidCount').textContent = data.paid_count || 0;
  } catch (e) {
    showToast('加载账单失败: ' + e.message);
  }
}

function goToPage(page) {
  if (page < 1 || page > state.totalPages) return;
  loadBills(page);
}

// ── Bill Selection ──
function toggleBillSelect(billId, checked) {
  if (checked) {
    state.selectedBills.add(billId);
  } else {
    state.selectedBills.delete(billId);
  }
  const card = document.getElementById(`bill-${billId}`);
  if (card) card.classList.toggle('selected', checked);
  updateBatchBtn();
}

function toggleSelectAll() {
  const unpaidBills = state.bills.filter(b => b.status === 'UNPAID' || b.status === 'OVERDUE');
  const allSelected = unpaidBills.every(b => state.selectedBills.has(b.bill_id));

  if (allSelected) {
    state.selectedBills.clear();
  } else {
    unpaidBills.forEach(b => state.selectedBills.add(b.bill_id));
  }
  renderBills(state.bills);
  updateBatchBtn();
}

function updateBatchBtn() {
  const btn = document.getElementById('batchPayBtn');
  const count = state.selectedBills.size;
  btn.textContent = count > 0 ? `💳 批量缴费 (${count})` : '💳 批量缴费';
  btn.disabled = count === 0;
}

// ── AI Interpretation ──
async function interpretBill(billId) {
  const panel = document.getElementById('aiPanel');
  const content = document.getElementById('aiContent');
  const reminderBox = document.getElementById('reminderBox');

  panel.style.display = 'block';
  content.innerHTML = '<div class="ai-loading"><span class="spinner"></span>小智正在分析您的账单...</div>';
  reminderBox.style.display = 'none';
  panel.scrollIntoView({ behavior: 'smooth' });

  try {
    const data = await fetchInterpret(billId);
    content.textContent = data.interpretation;

    if (data.reminder_text) {
      reminderBox.style.display = 'flex';
      const levelClass = data.reminder_level;
      const icons = { gentle: '💬', short: '⚠️', long: '🚨' };
      reminderBox.className = `reminder-box ${levelClass}`;
      reminderBox.innerHTML = `<span class="reminder-icon">${icons[levelClass] || '💬'}</span>${data.reminder_text}`;
    }
  } catch (e) {
    content.textContent = '抱歉，小智暂时无法解读这笔账单，请稍后再试。';
  }
}

function closeAIPanel() {
  document.getElementById('aiPanel').style.display = 'none';
}

        <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>公摊水电费</span><span>¥${bill.utility_fee.toFixed(2)}</span></div>

function closePayModal() {
  document.getElementById('payModal').style.display = 'none';

}

async function confirmPay() {
  if (!state.payingBillId) return;
  const btn = document.getElementById('confirmPayBtn');
  btn.disabled = true;
  btn.textContent = '处理中...';

  try {
    const result = await payBill(state.payingBillId);
    closePayModal();
    showToast('✅ 缴费成功！电子票据已生成');
    await loadBills(state.currentPage);
    setTimeout(() => viewReceipt(result.receipt_no), 500);
  } catch (e) {
    showToast('缴费失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '确认支付';
  }

// ── Batch Payment ──
function batchPaySelected() {
  if (state.selectedBills.size === 0) {
    showToast('请先选择需要缴费的账单');
    return;
  }

  const selectedIds = Array.from(state.selectedBills);
  const selectedBills = state.bills.filter(b => selectedIds.includes(b.bill_id));
  const total = selectedBills.reduce((s, b) => s + b.total_amount, 0);

  document.getElementById('batchPayContent').innerHTML = `
    <p style="margin-bottom:12px;">您即将批量支付以下 <strong>${selectedBills.length}</strong> 笔账单：</p>
    <div style="background:var(--bg);border-radius:10px;padding:16px;max-height:200px;overflow-y:auto;">
      ${selectedBills.map(b => `
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);">
          <span>${b.period} · ${b.user_name || ''}</span>
          <span>¥${b.total_amount.toFixed(2)}</span>
        </div>
      `).join('')}
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:8px 0;margin-top:4px;">
        <span>合计</span><span style="color:var(--primary);">¥${total.toFixed(2)}</span>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text-secondary);margin-top:12px;">* 此为模拟支付，点击确认后将批量更新账单状态。</p>
  `;
  document.getElementById('batchPayModal').style.display = 'flex';
}

function closeBatchPayModal() {
  document.getElementById('batchPayModal').style.display = 'none';
}

async function confirmBatchPay() {
  const btn = document.getElementById('confirmBatchPayBtn');
  btn.disabled = true;
  btn.textContent = '处理中...';

  try {
    const result = await payBillsBatch(Array.from(state.selectedBills));
    closeBatchPayModal();
    showToast(`✅ 批量缴费完成！成功 ${result.success_count} 笔${result.failed_count > 0 ? `，失败 ${result.failed_count} 笔` : ''}`);
    await loadBills(state.currentPage);
  } catch (e) {
    showToast('批量缴费失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '确认批量支付';
  }
}

// ── Role Switching ──
async function switchRole(role, userId) {
  state.currentRole = role;
  state.currentUserId = userId;
  state.selectedBills.clear();
  state.currentPage = 1;
  document.getElementById('aiPanel').style.display = 'none';

  // Update tabs
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-role="${role}"]`).classList.add('active');

  // Update user info
  try {
    const user = await fetchUser(userId);
    const roleNames = { owner: '业主用户', staff: '物业工作人员', admin: '社区管理员' };
    document.getElementById('infoName').textContent = user.name;
    document.getElementById('infoRole').textContent = roleNames[role] || role;
    document.getElementById('infoDetail').textContent = user.building && user.room
      ? `${user.building} ${user.room}室` : '全社区';
  } catch (e) {
    // ignore
  }

  await loadBills(1);
}

// ── Toast ──
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Init ──
document.getElementById('roleTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.role-tab');
  if (!tab) return;
  switchRole(tab.dataset.role, tab.dataset.user);
});

// Close modals on overlay click
['payModal', 'batchPayModal', 'receiptModal', 'historyModal', 'refundModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
      if (id === 'payModal') closePayModal();
      else if (id === 'batchPayModal') closeBatchPayModal();
      else if (id === 'receiptModal') closeReceiptModal();
      else if (id === 'historyModal') closeHistoryModal();
      else if (id === 'refundModal') closeRefundModal();
    }
  });
});

// Initial load
loadBills();
